<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#16263d"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="64" y1="160" x2="448" y2="160"/>
    <line x1="64" y1="240" x2="448" y2="240"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
  </g>

  <!-- Upward trend line (behind candles) -->
  <path d="M 80 356 L 196 276 L 290 308 L 408 166" fill="none" stroke="url(#trend)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Candlesticks -->
  <!-- Candle 1: red -->
  <g>
    <line x1="124" y1="200" x2="124" y2="330" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
    <rect x="100" y="232" width="48" height="72" rx="8" fill="#f87171"/>
  </g>
  <!-- Candle 2: green -->
  <g>
    <line x1="216" y1="170" x2="216" y2="320" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
    <rect x="192" y="198" width="48" height="86" rx="8" fill="#4ade80"/>
  </g>
  <!-- Candle 3: red small -->
  <g>
    <line x1="308" y1="150" x2="308" y2="270" stroke="#f87171" stroke-width="8" stroke-linecap="round"/>
    <rect x="284" y="176" width="48" height="58" rx="8" fill="#f87171"/>
  </g>
  <!-- Candle 4: green tall -->
  <g>
    <line x1="400" y1="96" x2="400" y2="246" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
    <rect x="376" y="120" width="48" height="92" rx="8" fill="#4ade80"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="436" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">ALGO<tspan fill="#4ade80">TRADE</tspan></text>
</svg>
